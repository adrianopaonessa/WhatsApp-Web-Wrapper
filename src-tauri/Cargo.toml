[package]
name = "whatsapp-web-wrapper"
version = "0.1.0"
description = "Native desktop wrapper for WhatsApp Web built with Tauri v2 and Rust"
authors = ["Adriano Paonessa"]
edition = "2021"
license = "MIT"
readme = "../README.md"
repository = "https://github.com/adrianopaonessa/whatsapp-web-wrapper"

[lib]
name = "whatsapp_web_wrapper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2", default-features = false }
gtk = { version = "0.18", default-features = false }
notify-rust = "4"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
